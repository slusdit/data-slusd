name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Placeholder values so config validation and `next build` can run without
      # real services. Nothing in CI connects to a database.
      DATABASE_URL: "mysql://ci:ci@127.0.0.1:3306/ci"
      AUTH_SECRET: "ci-placeholder-secret"
      AUTH_GOOGLE_ID: "ci"
      AUTH_GOOGLE_SECRET: "ci"
      DB_USER: ci
      DB_PASSWORD: ci
      DB_SERVER: 127.0.0.1
      DB_DATABASE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - run: npm run build
